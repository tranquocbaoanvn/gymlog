<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nhật ký tập luyện</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#14181f;--mu:#667080;--ln:#d9dee5;--ac:#2f5bff;--acf:#fff;--ok:#e3eaff;--dg:#c62f3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--sf:#1b2027;--ink:#eef1f5;--mu:#99a3b3;--ln:#2d3541;--ac:#6c8cff;--acf:#0b1020;--ok:#26304f;--dg:#ff7a85;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151a;--sf:#1b2027;--ink:#eef1f5;--mu:#99a3b3;--ln:#2d3541;--ac:#6c8cff;--acf:#0b1020;--ok:#26304f;--dg:#ff7a85;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 14px 120px}
h1,h2,.num{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:34px}h2{font-size:22px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
.fr{border-top:3px solid var(--ac);padding-top:14px;margin-top:22px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
.big{width:100%;font-size:17px;margin-top:8px}
.dg{color:var(--dg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.row>input{flex:1;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;width:100%;min-height:44px}
label{font-size:13px;color:var(--mu);flex:1}
.srow{display:grid;grid-template-columns:48px 1fr 34px 1fr 28px 46px;gap:6px;align-items:center;margin-top:6px}
.srow input{text-align:center;padding:6px 2px}
.srow.cur{background:var(--ok);border-radius:8px;outline:2px solid var(--ac);outline-offset:3px}
.srow.dn{opacity:.6}
.chk{padding:0;width:46px}.chk.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;z-index:6;max-width:696px;margin:0 auto}
#rest button{background:transparent;color:inherit;border-color:currentColor;min-height:38px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);grid-auto-columns:15px;gap:3px;overflow-x:auto;padding-bottom:6px}
.hm i{background:var(--ln);border-radius:3px;display:block;cursor:pointer}
.hm i.l1{background:var(--ac);opacity:.3}.hm i.l2{background:var(--ac);opacity:.55}.hm i.l3{background:var(--ac);opacity:.8}.hm i.l4{background:var(--ac)}.hm i.f{visibility:hidden}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.st .num{font-size:30px;line-height:1}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:20;display:none}
.lg{display:block;width:100%;text-align:left;border:0;background:none;padding:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal span{font-size:12px}.cal b{font-weight:500;font-size:14px;padding:9px 0;border-radius:6px;background:var(--ln);cursor:pointer}
.cal b.f{visibility:hidden}
.cal b.l1{background:color-mix(in srgb,var(--ac) 25%,var(--bg))}.cal b.l2{background:color-mix(in srgb,var(--ac) 50%,var(--bg))}
.cal b.l3{background:color-mix(in srgb,var(--ac) 75%,var(--bg));color:var(--acf)}.cal b.l4{background:var(--ac);color:var(--acf)}
button:disabled{opacity:.4;cursor:default}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;width:100%}
.srow.w{grid-template-columns:44px 76px 1fr 1fr 46px}.srow.h{font-size:12px;color:var(--mu);margin-top:8px}.srow.h span{text-align:center}
.pst{font-size:12px;color:var(--mu);line-height:1.2;text-align:center}.pst b{color:var(--ink);font-size:14px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.box{border:1px solid var(--ln);border-radius:8px;padding:10px}.box .num{font-size:30px;line-height:1.1}
.nt{white-space:pre-wrap}
.pg{display:block}
@media (min-width:900px){#app{max-width:1000px}.pg{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}}
.bs{fill:var(--sf);stroke:var(--ln);stroke-width:1}
.mz{stroke:var(--sf);stroke-width:1.2;cursor:pointer}
.m0{fill:var(--ln);background:var(--ln)}.m1{fill:#e5484d;background:#e5484d}.m2{fill:#f0a020;background:#f0a020}.m3{fill:#2fa866;background:#2fa866}.m4{fill:var(--ac);background:var(--ac)}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mm{width:100%;max-width:440px;display:block;margin:6px auto}.mt{margin-top:8px}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app"></div>
<div id="rest"><span>Nghỉ <b class="num" id="rt" style="font-size:26px"></b></span><span class="row"><button data-a="r15">+15s</button><button data-a="rskip">Bỏ qua</button></span></div>
<div id="toast"></div>
<script>
/* DÁN CLIENT ID CỦA BẠN VÀO DÒNG DƯỚI (xem hướng dẫn), giữ nguyên dấu ngoặc kép */
const CLIENT_ID="DÁN_CLIENT_ID_VÀO_ĐÂY";
const FILE_NAME="nhat-ky-tap-luyen.json";
const BASE=["Bench Press","Incline Dumbbell Press","Overhead Press","Lateral Raise","Squat","Leg Press","Romanian Deadlift","Deadlift","Barbell Row","Pull Up","Lat Pulldown","Bicep Curl","Triceps Pushdown","Dip"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>parseFloat(String(v).replace(",","."))||0;
const rid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>Math.round(n).toLocaleString("vi-VN");
const dt=t=>new Date(t).toLocaleDateString("vi-VN",{weekday:"short",day:"numeric",month:"numeric",year:"numeric"});
const clock=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const dk=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const vol=ex=>ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+num(s.w)*num(s.r),0),0);
const e1=s=>num(s.r)>0?num(s.w)*(1+num(s.r)/30):0;
let fin=null,hr="y",ho=0,mp=7,MM={};
let tok=null,tx=0,tc=null,fid=null,busy=false,again=false;try{fid=localStorage.getItem("gymlog2fid")}catch(e){}
let S={plans:[],logs:[],t:0},act=null,edit=null,rn=null,arm=null,open=null,pEx="",pM="w",sc=false,AC=null,syncMsg="Chỉ lưu trên máy này",pt=null,dref=null,days={};
try{const d=JSON.parse(localStorage.getItem("gymlog2"));if(d)S=d}catch(e){}
try{act=JSON.parse(localStorage.getItem("gymlog2act"))}catch(e){}
const persist=()=>{try{localStorage.setItem("gymlog2",JSON.stringify(S))}catch(e){}};
const pAct=()=>{try{act?localStorage.setItem("gymlog2act",JSON.stringify(act)):localStorage.removeItem("gymlog2act")}catch(e){}};
function push(){clearTimeout(pt);pt=setTimeout(sync,1500)}
function save(){S.t=Date.now();persist();push()}
function hdr(){const e=$("#sy");if(e)e.textContent=syncMsg}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}
function names(){return [...new Set([...BASE,...S.plans.flatMap(p=>p.ex.map(e=>e.name)),...S.logs.flatMap(l=>l.ex.map(e=>e.name))])].sort()}
function ask(k){if(arm===k){arm=null;return true}arm=k;setTimeout(()=>{if(arm===k){arm=null;R()}},3000);R();return false}
const lab=(k,t)=>arm===k?"Bấm lần nữa để xác nhận":t;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(AC.currentTime+.4)}catch(e){}}

/* ---------- Khung A ---------- */
function plansV(){
 return `<h2>Lịch tập</h2>${S.plans.length?"":`<div class="card mu">Chưa có lịch tập nào. Bấm “Tạo lịch tập mới” để thêm bài tập, số set, rep, kg và thời gian nghỉ.</div>`}
 ${S.plans.map(p=>`<div class="card">${rn===p.id?`<div class="row"><input id="rni" value="${esc(p.name)}" aria-label="Tên lịch tập"><button class="pri" data-a="rnok" data-id="${p.id}">Lưu</button><button data-a="rnx">Huỷ</button></div>`:`<h2>${esc(p.name)}</h2>`}
 <div class="mu">${p.ex.map(e=>esc(e.name)+" ("+e.sets.length+" set)").join(" · ")}</div>
 <div class="row" style="margin-top:8px"><button class="pri" data-a="start" data-id="${p.id}" style="flex:2">Bắt đầu</button><button data-a="edit" data-id="${p.id}">Sửa</button><button data-a="rn" data-id="${p.id}">Đổi tên</button><button class="dg" data-a="pdel" data-id="${p.id}">${lab("p"+p.id,"Xoá")}</button></div></div>`).join("")}
 <button class="big" data-a="new">+ Tạo lịch tập mới</button>`;
}
function editV(){
 return `<h2>${edit.id?"Sửa lịch tập":"Lịch tập mới"}</h2>
 <input data-f="pn" placeholder="Tên lịch tập, ví dụ: Ngày đẩy" value="${esc(edit.name)}" aria-label="Tên lịch tập" style="margin-top:8px">
 ${edit.ex.map((x,i)=>`<div class="card"><div class="row"><input data-f="en" data-e="${i}" list="dl" placeholder="Tên bài tập" value="${esc(x.name)}" aria-label="Tên bài tập"><button class="dg" data-a="xdel" data-e="${i}">Xoá</button></div>
 <div class="row" style="margin-top:8px"><label>Số set<input data-f="ns" data-e="${i}" inputmode="numeric" value="${x.sets.length}"></label><label>Nghỉ giữa set (giây)<input data-f="rs" data-e="${i}" inputmode="numeric" value="${x.rest}"></label></div>
 ${x.sets.map((s,j)=>`<div class="srow" style="grid-template-columns:48px 1fr 34px 1fr 28px"><span>Set ${j+1}</span><input data-f="pr" data-e="${i}" data-s="${j}" inputmode="numeric" value="${esc(s.r)}" placeholder="rep" aria-label="Số rep"><span class="mu">rep</span><input data-f="pw" data-e="${i}" data-s="${j}" inputmode="decimal" value="${esc(s.w)}" placeholder="kg" aria-label="Khối lượng kg"><span class="mu">Kg</span></div>`).join("")}</div>`).join("")}
 <datalist id="dl">${names().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
 <button class="big" data-a="xadd">+ Thêm bài tập</button>
 <div class="row" style="margin-top:10px"><button class="pri" data-a="psave" style="flex:2">Lưu lịch tập</button><button data-a="xcancel" style="flex:1">Huỷ</button></div>`;
}
function workV(){
 const c=act.cur,pl=S.logs.find(l=>l.pid?l.pid===act.pid:l.plan===act.name);
 return `<div class="row sp"><h2>${esc(act.name)}</h2><span class="num" id="tm" style="font-size:28px"></span></div>
 ${pl&&pl.note?`<div class="card" style="border-color:var(--ac)"><b>Lưu ý từ buổi trước (${dt(pl.start)})</b><div class="nt">${esc(pl.note)}</div></div>`:""}
 ${act.ex.map((x,i)=>{const p=pl&&pl.ex.find(e=>e.name===x.name);return `<div class="card"><div class="row sp"><b>${esc(x.name)}</b><span class="mu">Nghỉ ${clock(x.rest*1000)}</span></div>
 <div class="srow w h"><span>Set</span><span>Lần trước</span><span>Rep</span><span>Kg</span><span></span></div>
 ${x.sets.map((s,j)=>{const q=p&&p.sets[j];return `<div class="srow w ${c&&c[0]===i&&c[1]===j?"cur":""} ${s.d?"dn":""}"><span>Set ${j+1}</span><span class="pst">${q?`${esc(q.r)}×${esc(q.w)}<br><b>${fmt(num(q.r)*num(q.w))}</b>`:"–"}</span><input data-f="wr" data-e="${i}" data-s="${j}" inputmode="numeric" value="${esc(s.r)}" aria-label="Số rep"><input data-f="ww" data-e="${i}" data-s="${j}" inputmode="decimal" value="${esc(s.w)}" aria-label="Khối lượng Kg"><button class="chk ${s.d?"on":""}" data-a="chk" data-e="${i}" data-s="${j}" aria-label="Hoàn thành set ${j+1}">✓</button></div>`}).join("")}</div>`}).join("")}
 ${c?"":`<div class="card mu">Đã xong tất cả bài tập. Bấm Kết thúc để lưu vào nhật ký.</div>`}
 <div class="row" style="margin-top:10px"><button class="pri" data-a="finish" style="flex:2">Kết thúc và lưu</button><button class="dg" data-a="abort" style="flex:1">${lab("abort","Huỷ buổi tập")}</button></div>`;
}
function finV(){
 return `<h2>Lưu ý của buổi tập</h2><p class="mu">Ghi lại điều cần nhớ, ví dụ: hôm nay hơi ốm, set 3 chưa đúng form. Lưu ý này sẽ hiện ở đầu buổi tập lần sau.</p>
 <textarea id="nt" rows="5" placeholder="Lưu ý (không bắt buộc)" aria-label="Lưu ý buổi tập"></textarea>
 <div class="row" style="margin-top:10px"><button class="pri" data-a="fsave" style="flex:2">Lưu vào nhật ký</button><button data-a="fback" style="flex:1">Quay lại</button></div>`;
}
/* ---------- Khung B ---------- */
function heatV(){
 days={};S.logs.forEach(l=>{const k=dk(l.start),o=days[k]||(days[k]={n:0,v:0,p:[]});o.n++;o.v+=vol(l.ex);o.p.push(l.plan)});
 const mx=Math.max(1,...Object.values(days).map(o=>o.v)),td=new Date();td.setHours(12,0,0,0);
 const lv=(d,o)=>d>td?"f":o?"l"+Math.min(4,Math.max(1,Math.ceil(o.v/mx*4))):"";
 const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
 const sd=d=>d.getDate()+"/"+(d.getMonth()+1);
 let a,b,title,body;
 if(hr==="y"){const y=td.getFullYear()+ho;a=new Date(y,0,1,12);b=new Date(y,11,31,12);title="Năm "+y;let c="";
  for(const d=mon(a);d<=b;d.setDate(d.getDate()+1)){const k=dk(d);c+=`<i data-a="day" data-k="${k}" class="${d<a?"f":lv(d,days[k])}"></i>`}
  body=`<div class="hm" id="hm">${c}</div>`}
 else{
  if(hr==="m"){a=new Date(td.getFullYear(),td.getMonth()+ho,1,12);b=new Date(a.getFullYear(),a.getMonth()+1,0,12);title="Tháng "+(a.getMonth()+1)+"/"+a.getFullYear()}
  else{a=mon(td);a.setDate(a.getDate()+7*ho);b=new Date(a);b.setDate(a.getDate()+6);title="Tuần "+sd(a)+" – "+sd(b)}
  let c=["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<span class="mu">${x}</span>`).join("");
  for(const d=mon(a);d<=b;d.setDate(d.getDate()+1)){const k=dk(d);c+=`<b data-a="day" data-k="${k}" class="${d<a?"f":lv(d,days[k])}">${d.getDate()}</b>`}
  body=`<div class="cal">${c}</div>`}
 const ka=dk(a),kb=dk(b);let cnt=0;Object.keys(days).forEach(k=>{if(k>=ka&&k<=kb)cnt+=days[k].n});
 let cur=0,d=new Date(td);if(!days[dk(d)])d.setDate(d.getDate()-1);while(days[dk(d)]){cur++;d.setDate(d.getDate()-1)}
 const ks=Object.keys(days).sort();let lg=0,run=0,pv=null;
 ks.forEach(k=>{const p=k.split("-"),t=new Date(+p[0],+p[1]-1,+p[2],12);run=pv&&Math.round((t-pv)/864e5)===1?run+1:1;pv=t;lg=Math.max(lg,run)});
 return `<h2>Chuỗi luyện tập</h2><div class="card"><div class="row">${[["w","Tuần"],["m","Tháng"],["y","Năm"]].map(([k,t])=>`<button class="${hr===k?"pri":""}" data-a="hr" data-v="${k}" style="flex:1">${t}</button>`).join("")}</div>
 <div class="row sp" style="margin:8px 0"><button data-a="ho" data-d="-1" aria-label="Kỳ trước">‹</button><b>${title}</b><button data-a="ho" data-d="1" aria-label="Kỳ sau" ${ho>=0?"disabled":""}>›</button></div>
 ${body}<div class="mu" id="hi" style="margin-top:6px">Bấm vào một ô để xem ngày đó. Màu càng đậm là volume càng lớn.</div>
 <div class="st"><div><div class="num">${cur}</div><div class="mu">Chuỗi hiện tại (ngày)</div></div><div><div class="num">${lg}</div><div class="mu">Chuỗi dài nhất</div></div><div><div class="num">${cnt}</div><div class="mu">Buổi tập trong kỳ</div></div></div></div>`;
}
/* ---------- Tiến độ + nhật ký ---------- */
function progV(){
 const ex=[...new Set(S.logs.flatMap(l=>l.ex.map(e=>e.name)))].sort();
 if(!ex.includes(pEx))pEx=ex[0]||"";
 const T={w:"Tạ nặng nhất mỗi buổi (kg)",e:"1RM ước tính mỗi buổi (kg)",v:"Volume mỗi buổi: tổng rep × kg"};
 let body=`<div class="card mu">Hoàn thành một buổi tập để xem tiến độ từng bài.</div>`;
 if(pEx){
  const rows=S.logs.filter(l=>l.ex.some(e=>e.name===pEx)).map(l=>{const e=l.ex.find(x=>x.name===pEx);return{t:l.start,w:Math.max(...e.sets.map(s=>num(s.w))),e:Math.max(...e.sets.map(e1)),v:vol([e])}}).reverse();
  const val=r=>r[pM],vs=rows.map(val),mn=Math.min(...vs),mxv=Math.max(...vs),n=rows.length,L=rows[n-1];
  const Y=v=>mxv===mn?67:120-((v-mn)/(mxv-mn))*106,X=i=>n>1?50+i/(n-1)*254:177;
  const gl=mxv===mn?[mxv]:[mxv,(mxv+mn)/2,mn],dd=t=>new Date(t).toLocaleDateString("vi-VN",{day:"numeric",month:"numeric"});
  body=`<select data-f="px" aria-label="Bài tập" style="margin:8px 0">${ex.map(x=>`<option ${x===pEx?"selected":""}>${esc(x)}</option>`).join("")}</select>
  <div class="card"><b>Chỉ số của bài này</b><div class="g2" style="margin-top:8px">
  <div class="box"><div class="num">${fmt(Math.max(...rows.map(r=>r.w)))}</div><div>Tạ nặng nhất (kg)</div><div class="mu">Mức kg cao nhất từng nâng</div></div>
  <div class="box"><div class="num">${fmt(Math.max(...rows.map(r=>r.e)))}</div><div>1RM ước tính (kg)</div><div class="mu">Sức nâng tối đa 1 lần: kg × (1 + rep ÷ 30)</div></div>
  <div class="box"><div class="num">${fmt(L.v)}</div><div>Volume buổi gần nhất</div><div class="mu">Tổng rep × kg của bài này</div></div>
  <div class="box"><div class="num">${n}</div><div>Số buổi</div><div class="mu">Đã tập bài này</div></div></div></div>

  else{const bd="gl"+rid(),mb="--"+bd+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name:FILE_NAME,mimeType:"application/json"})+"\r\n--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bd+"--";
   fid=(await(await gf("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:mb})).json()).id}
  try{localStorage.setItem("gymlog2fid",fid)}catch(e){}
  syncMsg="Đã đồng bộ lúc "+new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
 }catch(e){
  if(/http 40[34]/.test(e.message)&&fid){fid=null;try{localStorage.removeItem("gymlog2fid")}catch(x){}busy=false;return sync()}
  syncMsg=e.message==="auth"?"Cần đăng nhập Google":"Lỗi đồng bộ, sẽ thử lại sau";
 }
 busy=false;(act||edit||fin)?hdr():R();if(again){again=false;sync()}
}
